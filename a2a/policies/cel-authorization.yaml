apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: a2a-cel-authz
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: a2a-route
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - 'request.headers["X-Scopes"].contains("a2a:invoke") && request.headers["X-Agent-Id"] != ""'
          - '!(request.path.matches("/a2a/admin/.*") || request.headers["x-a2a-method"] == "delete_agent")'
